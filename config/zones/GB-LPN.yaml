    - datetime: '2026-07-01'
      source: DESNZ Renewable Energy Planning Database (Q2 2026)
      value: 150
  wind:
    - datetime: '2026-07-01'
      source: DESNZ Renewable Energy Planning Database (Q2 2026)
      value: 5
  solar:
    - datetime: '2026-07-01'
      source: DESNZ Renewable Energy Planning Database (Q2 2026)
      value: 4
